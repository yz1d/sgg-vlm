id: https://w3id.org/sgg-vlm/schema/relationships
name: sgg_vlm_relationships
version: 0.1.0
description: Relationships supported by the sgg-vlm scene graph.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - road_regions
  - road_users

classes:
  Relationship:
    description: An abstract relationship between two entities in the scene graph.
    abstract: true
    attributes:
      id:
        description: Identity of this relationship within the scene.
        identifier: true
        range: string
        required: true
      type:
        description: Concrete LinkML class of this relationship.
        designates_type: true
        range: string
        required: true
      confidence:
        description: Final normalized confidence in the relationship assertion.
        range: float
        minimum_value: 0
        maximum_value: 1
      provenance:
        description: Sources that support the relationship assertion.
        range: Provenance
        multivalued: true
        inlined_as_list: true
        required: true

  SpatialRelationship:
    description: An abstract road-coordinate relationship from a perceived road user to ego.
    abstract: true
    is_a: Relationship
    attributes:
      subject:
        description: Perceived road user described relative to ego.
        range: PerceivedRoadUser
        required: true
      object:
        description: Ego vehicle used as the spatial reference.
        range: EgoVehicle
        required: true

  InFrontOf:
    description: The subject is longitudinally ahead of ego in road coordinates, regardless of the subject's facing or motion direction.
    is_a: SpatialRelationship
    annotations:
      relation_extraction: enabled
      exclusive_group: longitudinal

  Behind:
    description: The subject is longitudinally behind ego in road coordinates, regardless of the subject's facing or motion direction.
    is_a: SpatialRelationship
    annotations:
      relation_extraction: enabled
      exclusive_group: longitudinal

  LeftOf:
    description: The subject is laterally left of ego relative to ego's road heading, not merely in the left half of the image.
    is_a: SpatialRelationship
    annotations:
      relation_extraction: enabled
      exclusive_group: lateral

  RightOf:
    description: The subject is laterally right of ego relative to ego's road heading, not merely in the right half of the image.
    is_a: SpatialRelationship
    annotations:
      relation_extraction: enabled
      exclusive_group: lateral

  Near:
    description: The subject is within the configured near-distance threshold from ego in road coordinates.
    is_a: SpatialRelationship

  RoadRegionRelationship:
    description: An abstract relationship from a road user to a road region.
    abstract: true
    is_a: Relationship
    attributes:
      subject:
        description: Road user located in the road region.
        range: RoadUser
        required: true
      object:
        description: Road region that contains the road user's ground reference point.
        range: RoadRegion
        required: true

  InLane:
    description: The subject's ground reference point lies in the lane.
    is_a: RoadRegionRelationship
    slot_usage:
      object:
        range: Lane
    annotations:
      exclusive_group: lane_membership

  InIntersection:
    description: The subject's ground reference point lies in the intersection.
    is_a: RoadRegionRelationship
    slot_usage:
      object:
        range: Intersection
    annotations:
      exclusive_group: intersection_membership
