id: https://w3id.org/sgg-vlm/schema
name: sgg_vlm
version: 0.1.0
description: >-
  The normalized scene graph produced by sgg-vlm. The schema contains perceived
  road entities, road regions, object states, and supported relationships.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - linkml:types
  - common
  - weather
  - states
  - road_entities
  - road_regions
  - relationships

classes:
  Scene:
    description: A road scene corresponding to one input frame.
    tree_root: true
    attributes:
      frame_id:
        description: Frame-local identifier assigned by the input stage.
        identifier: true
        range: string
        required: true
      timestamp_ns:
        description: Optional source timestamp in nanoseconds.
        range: integer
        minimum_value: 0
      provenance:
        description: Sources that contributed the frame represented by this scene.
        range: Provenance
        multivalued: true
        inlined_as_list: true
        required: true
      ego:
        description: The observing vehicle, which is not represented by an image bounding box.
        range: EgoVehicle
        inlined: true
        required: true
      weather:
        description: Visible atmospheric condition for this scene.
        range: WeatherCondition
      perceived_entities:
        description: Non-ego road entities perceived in the frame.
        range: PerceivedRoadEntity
        multivalued: true
        inlined_as_list: true
      road_regions:
        description: Road regions perceived in the frame.
        range: RoadRegion
        multivalued: true
        inlined_as_list: true
      states:
        description: States observed on perceived road users in this frame.
        range: ObjectState
        multivalued: true
        inlined_as_list: true
      relationships:
        description: Relationships between entities represented in the scene.
        range: Relationship
        multivalued: true
        inlined_as_list: true
