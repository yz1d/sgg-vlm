id: https://w3id.org/sgg-vlm/schema
name: sgg_vlm
version: 0.1.0
description: >-
  The normalized scene graph produced by sgg-vlm. The schema contains scene
  objects, relations, visible weather, and frame provenance.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - linkml:types
  - common
  - weather
  - objects
  - relations

classes:
  Scene:
    description: A road scene corresponding to one input frame.
    tree_root: true
    attributes:
      frame_id:
        description: Frame-local identifier assigned by the input stage.
        identifier: true
        range: string
        required: true
      timestamp_ns:
        description: Optional source timestamp in nanoseconds.
        range: integer
        minimum_value: 0
      provenance:
        description: Sources that contributed the frame represented by this scene.
        range: Provenance
        multivalued: true
        inlined_as_list: true
        required: true
      weather:
        description: Visible atmospheric condition for this scene.
        range: WeatherCondition
      objects:
        description: Potentially moving, road, and static objects represented in the scene.
        range: SceneObject
        multivalued: true
        inlined_as_list: true
        required: true
      relations:
        description: Relations between objects represented in the scene.
        range: Relation
        multivalued: true
        inlined_as_list: true
        required: true
