id: https://w3id.org/sgg-vlm/schema/states
name: sgg_vlm_states
version: 0.1.0
description: Object states supported by the sgg-vlm scene graph.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - common
  - road_users

classes:
  ObjectState:
    description: An abstract provenance-carrying state observed on a perceived road user.
    abstract: true
    attributes:
      type:
        description: Concrete LinkML class of this object state.
        designates_type: true
        range: string
        required: true
      subject:
        description: Perceived road user whose state is being described.
        range: PerceivedRoadUser
        required: true
      confidence:
        description: Final normalized confidence in the state assertion.
        range: float
        minimum_value: 0
        maximum_value: 1
      provenance:
        description: Sources supporting the state assertion.
        range: Provenance
        multivalued: true
        inlined_as_list: true
        required: true

  StopArmState:
    description: An assertion about a school bus's mounted stop arm.
    is_a: ObjectState
    slot_usage:
      subject:
        range: SchoolBus
    attributes:
      value:
        description: Asserted stop-arm position.
        range: StopArmStateValue
        required: true

enums:
  StopArmStateValue:
    description: Supported positions of a school bus's mounted stop arm.
    permissible_values:
      deployed:
        description: The stop arm projects outward from the bus.
        annotations:
          relation_extraction_prompt: The stop arm is visibly extended outward from the side of the bus.
      stowed:
        description: The stop arm is folded against the bus.
        annotations:
          relation_extraction_prompt: The stop arm is visibly folded flat against the side of the bus.
