id: https://w3id.org/sgg-vlm/schema/relations
name: sgg_vlm_relations
version: 0.1.0
description: Relations supported by the sgg-vlm scene graph.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - objects

classes:
  Relation:
    description: An abstract relation between two objects in the scene graph.
    abstract: true
    attributes:
      id:
        description: Identity of this relation within the scene.
        identifier: true
        range: string
        required: true
      type:
        description: Concrete LinkML class of this relation.
        designates_type: true
        range: string
        required: true
      provenance:
        description: Sources that support the relation assertion.
        range: Provenance
        multivalued: true
        inlined_as_list: true
        required: true

  SpatialRelation:
    description: An abstract road-coordinate relation from a scene object to ego.
    abstract: true
    is_a: Relation
    attributes:
      subject:
        description: Scene object described relative to ego.
        range: SceneObject
        required: true
      object:
        description: Ego vehicle used as the spatial reference.
        range: EgoVehicle
        required: true

  InFrontOf:
    description: The subject is longitudinally ahead of ego in road coordinates, regardless of the subject's facing or motion direction.
    is_a: SpatialRelation
    annotations:
      relation_extraction: enabled
      exclusive_group: longitudinal

  Behind:
    description: The subject is longitudinally behind ego in road coordinates, regardless of the subject's facing or motion direction.
    is_a: SpatialRelation
    annotations:
      relation_extraction: enabled
      exclusive_group: longitudinal

  LeftOf:
    description: The subject is laterally left of ego relative to ego's road heading, not merely in the left half of the image.
    is_a: SpatialRelation
    annotations:
      relation_extraction: enabled
      exclusive_group: lateral

  RightOf:
    description: The subject is laterally right of ego relative to ego's road heading, not merely in the right half of the image.
    is_a: SpatialRelation
    annotations:
      relation_extraction: enabled
      exclusive_group: lateral

  RoadObjectRelation:
    description: An abstract relation from a scene object to a road object.
    abstract: true
    is_a: Relation
    attributes:
      subject:
        description: Scene object located in the road object.
        range: SceneObject
        required: true
      object:
        description: Road object that contains the subject's ground reference point.
        range: RoadObject
        required: true

  InLane:
    description: The subject's ground reference point lies in the lane.
    is_a: RoadObjectRelation
    slot_usage:
      object:
        range: Lane
    annotations:
      exclusive_group: lane_membership

  LaneRelation:
    description: An abstract topological relation between two lanes.
    abstract: true
    is_a: Relation
    attributes:
      subject:
        description: Lane from which the topological relation is stated.
        range: Lane
        required: true
      object:
        description: Lane related to the subject lane.
        range: Lane
        required: true

  LeftAdjacentTo:
    description: The subject is directly left of the object when viewed along their shared traffic direction.
    is_a: LaneRelation
    annotations:
      road_layout_extraction: enabled
      topology_constraint: same_non_crossing_direction

  Overlaps:
    description: The subject and object lanes have overlapping traffic paths.
    is_a: LaneRelation
    annotations:
      road_layout_extraction: enabled
      symmetric: enabled
