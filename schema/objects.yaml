id: https://w3id.org/sgg-vlm/schema/objects
name: sgg_vlm_objects
version: 0.1.0
description: Scene object types supported by the sgg-vlm scene graph.

prefixes:
  linkml: https://w3id.org/linkml/
  sggvlm: https://w3id.org/sgg-vlm/

default_prefix: sggvlm
default_range: string

imports:
  - common

classes:
  ObjectProvenance:
    description: Provenance that identifies the parts of an object record supported by a source.
    is_a: Provenance
    attributes:
      supports:
        description: Decisions in the object record supported by this source.
        range: ObjectDecision
        multivalued: true
        required: true

  SceneObject:
    description: An object represented in the scene graph.
    abstract: true
    attributes:
      id:
        description: Identity used to reference this object within the scene.
        identifier: true
        range: string
        required: true
      type:
        description: Concrete LinkML class of this object.
        designates_type: true
        range: string
        required: true
      bbox:
        description: Optional image-space bounding box in pixel XYXY coordinates.
        range: BoundingBox2D
        inlined: true
      track_id:
        description: Optional cross-frame identity for the same physical object.
        range: string
      provenance:
        description: Sources that support decisions in this object record.
        range: ObjectProvenance
        multivalued: true
        inlined_as_list: true
        required: true

  PotentiallyMovingObject:
    description: A visible object that takes an active or passive part in traffic.
    is_a: SceneObject
    abstract: true
    slot_usage:
      bbox:
        required: true

  EgoVehicle:
    description: The observing vehicle and reference object for spatial relations.
    is_a: SceneObject
    slot_usage:
      id:
        equals_string: ego

  Vehicle:
    description: A motorized vehicle represented in the traffic scene.
    is_a: PotentiallyMovingObject
    abstract: true
    attributes:
      opening_state:
        description: Visible state of the vehicle doors, hood, trunk, hatch, tailgate, or cargo doors.
        range: VehicleOpeningState

  Car:
    description: A motorized vehicle designed primarily for passenger transportation. A car typically has four wheels.
    is_a: Vehicle

  Truck:
    description: A motorized vehicle designed primarily to transport cargo.
    is_a: Vehicle

  Bus:
    description: A motorized vehicle designed to carry multiple passengers.
    is_a: Vehicle

  SchoolBus:
    description: A bus used to transport students.
    is_a: Bus
    attributes:
      stop_arm_position:
        description: Visible position of the school bus stop arm.
        range: StopArmPosition

  Motorcycle:
    description: A motorized vehicle designed primarily for passenger transportation on two or three wheels.
    is_a: Vehicle

  Animal:
    description: A visible non-human animal that can affect traffic, including wild animals, domestic animals and livestock.
    is_a: PotentiallyMovingObject

  Cyclist:
    description: A person riding a bicycle.
    is_a: PotentiallyMovingObject

  Pedestrian:
    description: A person on foot in the traffic scene.
    is_a: PotentiallyMovingObject

  ConstructionWorker:
    description: A person visibly performing construction or maintenance work in the traffic scene.
    is_a: PotentiallyMovingObject

  PoliceOfficer:
    description: A visibly identifiable police officer in the traffic scene.
    is_a: PotentiallyMovingObject

  RoadObject:
    description: A road surface, road limitation, or road structure represented in the scene.
    is_a: SceneObject
    abstract: true

  Lane:
    description: A semantic traffic lane relevant to ego's immediate driving situation.
    is_a: RoadObject
    attributes:
      direction:
        description: Traffic direction in this lane relative to ego's direction.
        range: LaneDirection
        required: true

  StaticObject:
    description: A fixed landmark, traffic sign, sign board, or traffic light.
    is_a: SceneObject
    abstract: true

enums:
  ObjectDecision:
    description: A decision bundled into an object record.
    permissible_values:
      existence:
        description: The object exists in the scene.
      classification:
        description: The object has the selected concrete type.
      bounding_box:
        description: The object occupies the selected image bounding box.
      tracking:
        description: The object has the selected cross-frame track identity.
      attributes:
        description: The object has the selected object-specific attribute values.

  VehicleOpeningState:
    description: Visible state of the openable parts of a vehicle body.
    permissible_values:
      open:
        description: At least one applicable vehicle opening is visibly open.
      closed:
        description: All applicable visible vehicle openings appear closed.

  LaneDirection:
    description: Traffic direction in a lane relative to ego's direction.
    permissible_values:
      same_as_ego:
        description: Traffic travels approximately in ego's direction.
      opposite_to_ego:
        description: Traffic travels approximately opposite ego's direction.
      crossing:
        description: Traffic crosses ego's general direction.

  StopArmPosition:
    description: Supported positions of a school bus stop arm.
    permissible_values:
      deployed:
        description: The stop arm is visibly extended outward from the side of the bus.
      stowed:
        description: The stop arm is visibly folded flat against the side of the bus.
