timeout_seconds: 120
max_tokens: 8192

stages:
  detection:
    platform: qwen
    reasoning:
      mode: disabled
  road_layout:
    platform: qwen
    reasoning:
      mode: enabled
      effort: low
  relations:
    platform: qwen
    reasoning:
      mode: enabled
      effort: low
  weather:
    platform: qwen
    reasoning:
      mode: disabled

platforms:
  qwen:
    model: dashscope/qwen3.8-max
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  gemini:
    model: gemini/gemini-3.5-flash
    api_base: https://generativelanguage.googleapis.com/v1beta
