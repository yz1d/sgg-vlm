timeout_seconds: 120
max_tokens: 8192

stages:
  detection:
    platform: qwen
    reasoning:
      mode: disabled
  road_region:
    platform: gemini
    reasoning:
      mode: enabled
      effort: low
  relations:
    platform: qwen
    reasoning:
      mode: enabled
      effort: low
  weather:
    platform: qwen
    reasoning:
      mode: disabled

platforms:
  qwen:
    model: dashscope/qwen3.8-max
    api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

  kimi:
    model: moonshot/kimi-k2.6
    api_base: https://api.moonshot.ai/v1

  glm:
    model: zai/glm-4.5v
    api_base: https://api.z.ai/api/paas/v4

  gemini:
    model: gemini/gemini-3.6-flash
    api_base: https://generativelanguage.googleapis.com/v1beta
